name: Build Instagram APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Prepare Environment Variables (.env)
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          if [ -n "$APP_ENV" ]; then
            echo "$APP_ENV" > .env
          fi
          if [ -f .env ]; then
            cp .env app/.env
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Optimize Raw Videos for Discord Upload (< 25 MB APK)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          for f in app/src/main/res/raw/*.mp4; do
            if [ -f "$f" ]; then
              echo "Compressing $f..."
              ffmpeg -i "$f" -vcodec libx264 -crf 32 -preset fast -acodec aac -b:a 64k -movflags +faststart "${f}.min.mp4" -y
              mv "${f}.min.mp4" "$f"
              ls -lh "$f"
            fi
          done

      - name: Run Unit Tests
        env:
          JAVA_TOOL_OPTIONS: "-Drobolectric.dependency.repo.url=https://maven-central.storage-download.googleapis.com/maven2"
        run: ./gradlew testDebugUnitTest --no-configuration-cache --stacktrace

      - name: Print Unit Test Results
        if: always()
        run: |
          for f in app/build/test-results/testDebugUnitTest/TEST-*.xml; do
            [ -f "$f" ] && echo "=== $f ===" && head -n 40 "$f"
          done

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Instagram-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK (if generated)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Instagram-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
